name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (node + web bundles, grammars)
        run: npm run build:prod
        env:
          HELICODE_REQUIRE_GRAMMARS: '1'
      - name: Smoke test the web bundle
        run: npm run check-web
      - name: Check tree-sitter queries
        if: runner.os == 'Linux'
        run: npm run check-queries
      - name: Verify the keybindings are up to date
        if: runner.os == 'Linux'
        run: |
          npm run gen-keybindings
          git diff --exit-code package.json
      - run: npx vsce package --no-dependencies
      - name: Integration tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: helicode-vsix-${{ matrix.os }}
          path: '*.vsix'
