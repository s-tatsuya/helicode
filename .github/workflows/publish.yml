name: Publish

# Publishes to the VS Code Marketplace and Open VSX when a `v*` tag is pushed,
# and attaches the .vsix to the GitHub release.
#
# Secrets: VSCE_PAT (Azure DevOps personal access token), OVSX_PAT (optional).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach the .vsix without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:prod
        env:
          HELICODE_REQUIRE_GRAMMARS: '1'
      - run: npm run check-web
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npx vsce package --no-dependencies
      - name: Publish to the VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: npx vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: helicode-vsix
          path: '*.vsix'
      - name: Attach the .vsix to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
